<!DOCTYPE html>
<html lang="pt-br">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <meta name="description" content="Exemplo de formulário de suporte tecnico">
    <meta name="keywords" content="HTML, Formulário, Suporte Técnico, Upload de Arquivo">
    <meta name="author" content="Gabriel Vieira">
    <title>Suporte Técnico</title>
</head>
<body>
    <a href="index.html">Voltar</a>     
    <form action="https://httpbin.org/post" method="post" enctype="multipart/form-data">
            <fieldset>
                <legend>Abrir chamado tecnico</legend>
            <label for="nome">Nome Completo:</label><br>
            <input type="text" id="nome" name="nome" required><br>
            <label for="email">Email de contato:</label><br>
            <input type="email" id="email" name="email" required><br>
            <label for="prioridade">Prioridade:</label><br>
            <select name="prioridade" id="prioridade" required>
            <option value="baixa">Baixa</option>
            <option value="média">Média</option>
            <option value="alta">Alta</option>
            </select>
            <label for="arquivo">Arquivo de log ou print:</label><br>
            <input type="file" name="arquivo" id="arquivo" accept="image/png,application/pdf" aria-describedby="arquivo-help" required><br>
            <p id="arquivo-help">Por favor, selecione um arquivo PNG ou PDF.</p>
            <button type="submit">Enviar</button>
        
</fieldset>
</form>
</body>
</html>
