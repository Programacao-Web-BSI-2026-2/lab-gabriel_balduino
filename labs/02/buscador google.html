<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <meta name="description" content="Exemplo de formulário para busca no google">
    <meta name="keywords" content="HTML, Formulário, Busca Google">
    <meta name="author" content="Gabriel Vieira">
    <title>Pesquisador</title>
</head>
<body>
    <form action="https://www.google.com/search" method="get">
        <label for="pesquisa">Pesquisar no google</label><br>
       <input type="search" id="pesquisa" name="q" placeholder="Pesquise o que quiser">
        <input type="submit" name="name" value="Buscar">
        <input type="reset" name="name" value="Limpar">
    
    </form>
</body> 
</html>
