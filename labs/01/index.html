<!DOCTYPE html>
<html lang="pt-BR">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <meta name="description" content="Aula e HTML e CSS">
    <title>Suporte</title>
</head>
<body>
    <header>
        <h1>Área de Contato do Cliente</h1>
        <nav class="menu">
            <a href="#">Ajuda</a>
            <a href="#">Sair</a>
            <a href="../../index.html">Voltar ao menu</a>
        </nav>
        
    </header>

    <main>
        <article>
            <h2>Envie sua mensagem para a nossa equipe de suporte backend</h2>
        
        <form action="/enviar" method="POST">
            <label for="nome">Nome:</label> <input type="text" id="nome" name="nome" 
              required minlength="3" placeholder="Digite seu nome completo"><br><br>
            <label for="email">Email:</label> <input type="email" id="email" name="email" 
              required minlength="5" placeholder="exemplo@dominio.com"><br><br>
            <label for="cel">Telefone celular:</label> <input type="tel" id="cel" name="cel" pattern=[0-9]{11} required><br><br>
            <label for="msg">Mensaem:</label> <textarea id="msg"></textarea><br><br>
            
            <input type="button" value="Disparar Dados">
        </form>
    </article>
</main>

    <footer>
        Suporte Tech 2026
    </footer>
</body>
</html>
